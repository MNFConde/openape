<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAPE</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1rem 1.5rem;
        color: #1a1a1a;
      }
      h2 {
        font-size: 1rem;
        margin: 1.5rem 0 0.5rem;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.875rem;
      }
      th,
      td {
        text-align: left;
        padding: 0.25rem 0.5rem;
        border-bottom: 1px solid #e5e5e5;
      }
      th {
        font-weight: 600;
        color: #555;
      }
      /* [raw] 用弱化的颜色：它表示"这里没有语义"，不是警告。 */
      td.raw {
        color: #8a6d3b;
      }
      #faults {
        padding-left: 1.25rem;
        font-size: 0.875rem;
      }
      #variables-note {
        color: #8a6d3b;
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenAPE</h1>
      <p id="status">连接中…</p>

      <h2>样本曲线</h2>
      <div id="chart"></div>

      <h2>标定量与观测量</h2>
      <p id="variables-note"></p>
      <table>
        <thead>
          <tr>
            <th>符号</th>
            <th>地址</th>
            <th>类型</th>
            <th>角色</th>
            <th>语义</th>
          </tr>
        </thead>
        <tbody id="variables"></tbody>
      </table>

      <h2>故障</h2>
      <ul id="faults"></ul>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
