[workspace]
resolver = "3"
members = ["crates/*", "vendor/a2ltool-dwarf"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["OpenAPE contributors"]

[workspace.dependencies]
# 内部 crate，按分档顺序排列（L0 → L5）；依赖只准向下
openape-diag = { path = "crates/diag" }
openape-cal-core = { path = "crates/cal-core" }
openape-format-a2l = { path = "crates/format-a2l" }
openape-format-dbc = { path = "crates/format-dbc" }
openape-format-elf = { path = "crates/format-elf" }
openape-format-cdf = { path = "crates/format-cdf" }
openape-format-mf4 = { path = "crates/format-mf4" }
openape-xcp-proto = { path = "crates/xcp-proto" }
openape-proto = { path = "crates/proto" }
openape-bus = { path = "crates/bus" }
openape-bus-socketcan = { path = "crates/bus-socketcan" }
openape-bus-socketcand = { path = "crates/bus-socketcand" }
openape-bus-replay = { path = "crates/bus-replay" }
openape-bus-zlg = { path = "crates/bus-zlg" }
openape-xcp = { path = "crates/xcp" }
openape-assembly = { path = "crates/assembly" }
openape-session = { path = "crates/session" }
openape-sim-ecu = { path = "crates/sim-ecu" }
openape-daemon = { path = "crates/daemon" }
openape-cli = { path = "crates/cli" }

# 外部依赖：版本只在此处钉
ablf = "0.2"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
proptest = "1"
prost = "0.14"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = "0.1"
http-body-util = "0.1"
mf4-rs = "3.8"
socketcan = { version = "4", default-features = false, features = ["netlink", "tokio"] }
thiserror = "2"
# 桌面外壳（L5，仅 Windows，D-21）。别的平台不解析这两个版本，但要一个地方钉住。
tauri = "2"
tauri-build = "2"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "process"] }
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-web = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# 与 CI 的 -D warnings 同口径：本地不跑门禁也挡得住。prost/tonic 生成代码在
# crates/proto/src/lib.rs 的内层 allow 里例外（内层 allow 能覆盖外层 deny）。
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
# 与 unwrap_used 对称：测试侧的豁免在 clippy.toml（allow-*-in-tests），
# 所以这里开 warn 后生产代码里的每一处都必须是显式的 expect 而非沉默。
expect_used = "warn"
todo = "warn"
