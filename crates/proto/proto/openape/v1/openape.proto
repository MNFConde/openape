syntax = "proto3";

package openape.v1;

// 空入参。
message Empty {}

// 总线后端能力。上层据此决定可用的帧类型与时间戳精度。
message BusCapabilities {
  bool classic_can = 1;
  bool can_fd = 2;
  bool hardware_timestamp = 3;
}

// 一条通道的探测结果。
message ChannelProbe {
  string channel = 1;
  string backend = 2;
  BusCapabilities capabilities = 3;
}

message ProbeChannelRequest {
  string channel = 1;
}

message ListChannelsResponse {
  repeated string channels = 1;
}

// 协议版本。
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// 建链后从站报告的会话参数。
message ConnectInfo {
  uint32 resource = 1;
  uint32 comm_mode_basic = 2;
  uint32 max_cto = 3;
  uint32 max_dto = 4;
  // 缺失表示从站没上报，不臆造默认值。
  ProtocolVersion protocol_version = 5;
  ProtocolVersion transport_version = 6;
}

message ConnectRequest {
  uint32 mode = 1;
}

message SessionStatus {
  bool running = 1;
  uint32 protection = 2;
}

// 读一段内存。地址用字符串：JS 的 number 只精确到 2^53。
message ReadRequest {
  string address = 1;
  uint32 len = 2;
}

message ReadResponse {
  string channel = 1;
  string address = 2;
  uint32 len = 3;
  string data_hex = 4;
}

// 一个要采集的内存块。
message DaqSignal {
  string address = 1;
  uint32 len = 2;
}

// 一条 DAQ list 的配置。
message DaqList {
  uint32 event = 1;
  uint32 prescaler = 2;
  repeated DaqSignal signals = 3;
}

message DaqConfig {
  repeated DaqList lists = 1;
}

// 一个 ODT 承载哪几段字节，按信号顺序给出长度。
message DaqOdt {
  uint32 pid = 1;
  repeated uint32 signal_lens = 2;
}

message DaqLayout {
  repeated DaqOdt odts = 1;
}

// 一条 DAQ 样本：一帧 DTO 的载荷。
message DaqSample {
  uint32 pid = 1;
  uint64 timestamp_us = 2;
  bytes payload = 3;
}

message StreamRequest {}

// 离线重开（M5-05）：从 daemon 主机侧的一份录制文件按点推流。路径与
// 通道都由调用方指定——路径是 daemon 所在主机的路径，浏览器拿不到
// daemon 的文件系统，这正是把读端放在 daemon 的原因。
message RecordingRequest {
  // 录制文件路径（MF4）。相对路径按 daemon 进程的工作目录解析。
  string path = 1;
  // 要取的数据通道名（不带时间主通道）。
  string channel = 2;
}

// 录制文件里的一条点：解好值的物理值 + 相对采集起点的微秒时间戳。
message RecordingPoint {
  uint64 timestamp_us = 1;
  double value = 2;
}

// 指标快照。
message MetricsSnapshot {
  double daq_fps = 1;
  uint64 daq_frames_total = 2;
  uint64 dropped_frames_total = 3;
  uint32 latency_p50_us = 4;
  uint32 latency_p99_us = 5;
  uint64 latency_samples = 6;
  uint64 queue_depth = 7;
  uint64 rss_bytes = 8;
}

// 存活探针。名字不与 rpc 方法同名：protoc 在 service 内解析返回类型时
// 会先看到方法名，同名会报 "is not a message type"。
message HealthStatus {
  bool ok = 1;
  string version = 2;
}

// daemon 当前接管了什么。
message SessionReport {
  string channel = 1;
  bool linked = 2;
  ConnectInfo info = 3;
  bool capturing = 4;
}

// CLI 的结构化输出：通道列表 + 可选的一条探测结果。
message BusReport {
  repeated string channels = 1;
  ChannelProbe probed = 2;
}

// CLI 的结构化输出：建链。
message ConnectReport {
  string channel = 1;
  ConnectInfo info = 2;
}

// 一个变量在界面上的样子。语义缺失时 `raw` 为真，界面标 [raw]，
// 不填默认值假装知道单位与换算（D-13）。
message VariableEntry {
  string symbol = 1;
  uint32 address = 2;
  string elem = 3;
  repeated uint32 dims = 4;
  // 角色。空串表示尚未指定，由用户在界面上选。
  string role = 5;
  bool raw = 6;
  // 量程。带 A2L 时有值，界面用它提示"可写范围"。
  RangeCheck range = 7;
}

// 一段量程与它的实际物理值。
message RangeCheck {
  double min = 1;
  double max = 2;
  // 本次写入的物理值。仅写入结果里出现，列表里为 0。
  double physical = 3;
}

// 写一个标定量。一次只接一个符号一个值——整表写入的入口不提供（D-13）。
message WriteRequest {
  // 地址用字符串：JS 的 number 只精确到 2^53。
  string address = 1;
  uint32 len = 2;
  string data_hex = 3;
  // 符号名。有变量清单时按它取长度、量程与元素类型。
  string symbol = 4;
  // 谁发起的，进审计。
  string actor = 5;
  // 物理值。给了它就由 daemon 按变量的元素类型与换算编码，data_hex 必须留空：
  // 两个来源同时给等于没有来源。
  optional double value = 6;
}

message WriteResponse {
  string channel = 1;
  string symbol = 2;
  string address = 3;
  string before_hex = 4;
  string after_hex = 5;
  // 写前快照文件路径。回滚用它，不必再回读。
  string snapshot_path = 6;
  // 是否做过量程校验。仅 ELF 档为 false，界面标 [raw]。
  bool range_checked = 7;
  RangeCheck range = 8;
  // 审计时刻（ISO-8601 UTC）。
  string audited_at = 9;
  uint32 len = 10;
}

// 当前标定页。
message CalPageResponse {
  string channel = 1;
  uint32 page = 2;
}

message SetCalPageRequest {
  uint32 page = 1;
}

// 两页对比。取样范围是变量清单里的标定量，观测量不上页。
message PageDiffRequest {
  uint32 reference_page = 1;
  uint32 working_page = 2;
}

// 一条页间差异。哪一侧缺失由 `in_*` 说明，空字符串与"值为空"因此不混淆。
message Difference {
  string symbol = 1;
  string address = 2;
  string reference_hex = 3;
  string working_hex = 4;
  bool in_reference = 5;
  bool in_working = 6;
}

message PageDiffResponse {
  uint32 reference_page = 1;
  uint32 working_page = 2;
  repeated Difference differences = 3;
}

// 一条审计记录。字段与 session 的审计日志一一对应，查询不走另一条路。
message AuditEntry {
  string at = 1;
  string actor = 2;
  string symbol = 3;
  string address = 4;
  string before_hex = 5;
  string after_hex = 6;
  // 输入档：elf_only 或 with_a2l。两档数值不可混比。
  string mode = 7;
}

message AuditList {
  repeated AuditEntry entries = 1;
}

// 解锁被保护的资源（GET_SEED + UNLOCK）。成功才返回。
message UnlockResponse {
  string channel = 1;
}

message VariableList {
  repeated VariableEntry variables = 1;
  // 加载期提示：被跳过的变量、降级的字段。
  repeated string notes = 2;
  // 没加载任何信息源时为空，界面据此说明"未加载描述文件"。
  bool loaded = 3;
}

// 一条故障。字段与 `openape_diag::Fault` 一一对应，不再另造错误类型。
message FaultEvent {
  string code = 1;
  string severity = 2;
  string message = 3;
  string hint = 4;
  uint64 occurred_at_us = 5;
}

message FaultList {
  repeated FaultEvent faults = 1;
}

// daemon 对 CLI 与 UI 提供的服务。
service OpenApe {
  rpc ListChannels(Empty) returns (ListChannelsResponse);
  rpc ProbeChannel(ProbeChannelRequest) returns (ChannelProbe);
  // 读一段内存。daemon 接管硬件时由它代读，CLI 因此不必抢设备锁。
  rpc ReadMemory(ReadRequest) returns (ReadResponse);
  // daemon 的会话状态。CLI 用它回答"现在是谁拿着设备"。
  rpc GetSession(Empty) returns (SessionReport);
  rpc Health(Empty) returns (HealthStatus);
  rpc GetMetrics(Empty) returns (MetricsSnapshot);
  // 采集样本流。慢消费者丢最旧，丢掉的量在指标里可查。
  rpc StreamSamples(StreamRequest) returns (stream DaqSample);

  // 离线重开：按点推一份录制文件里指定通道的样本（M5-05）。
  rpc OpenRecording(RecordingRequest) returns (stream RecordingPoint);
  // 当前加载的变量清单。界面用它画标定量表格。
  rpc ListVariables(Empty) returns (VariableList);
  // 最近的故障。只读 `openape_diag::Fault`，daemon 不自造错误类型。
  rpc ListFaults(Empty) returns (FaultList);
  // 写一个标定量。带写前读回、量程校验、快照与审计；daemon 持硬件时代写。
  rpc WriteMemory(WriteRequest) returns (WriteResponse);
  // 当前标定页。
  rpc GetCalPage(Empty) returns (CalPageResponse);
  // 切标定页，切完读回确认。
  rpc SetCalPage(SetCalPageRequest) returns (CalPageResponse);
  // 两页差异，只列有差异的地址。
  rpc DiffPages(PageDiffRequest) returns (PageDiffResponse);
  // 审计日志。写入与回滚都留痕，界面与 CLI 都查这同一份。
  rpc ListAudit(Empty) returns (AuditList);
  // 解锁被保护的资源。解锁是写入的前提，单独成一条命令便于排障。
  rpc Unlock(Empty) returns (UnlockResponse);
}
